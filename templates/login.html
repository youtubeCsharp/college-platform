<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>登录 - 数字经济与管理学院综合管理平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-head">
      <div class="login-star">★</div>
      <h1>数字经济与管理学院</h1>
      <h2>综合管理平台</h2>
      <div class="login-head-line"></div>
    </div>
    <form id="login-form" autocomplete="off">
      <label class="field">用户名
        <input id="username" autocomplete="username" required>
      </label>
      <label class="field">密&nbsp;&nbsp;&nbsp;码
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="login-error"></div>
      <button type="submit" class="btn btn-red btn-block">登&nbsp;&nbsp;录</button>
    </form>
    <p class="login-tip">内网专属系统 · 数据本地留存 · 请使用学院分配账号登录</p>
  </div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('login-error');
  err.textContent = '';
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value
    })
  });
  const d = await r.json();
  if (d.ok) { location.href = '/'; }
  else { err.textContent = d.error || '登录失败,请重试。'; }
});
</script>
</body>
</html>
